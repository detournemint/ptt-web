<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio PTT</title>
<style>
  :root { --bg:#111418; --fg:#e8eaed; --mut:#8a919b; --card:#1a1f26; --ok:#3fb950; --tx:#f85149; --acc:#58a6ff; --line:#2a3340; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; }
  main { width:100%; max-width:460px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:18px; margin:4px 0; font-weight:600; }
  .card { background:var(--card); border-radius:12px; padding:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .grid { display:flex; gap:8px; align-items:center; }
  .mut { color:var(--mut); font-size:13px; }
  #freq { font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  #ptt { width:100%; height:200px; border:0; border-radius:16px; font-size:28px; font-weight:700;
         background:var(--line); color:var(--fg); touch-action:none; user-select:none; -webkit-user-select:none; }
  #ptt:disabled { opacity:.4; }
  #ptt.keying { background:#9a6700; }
  #ptt.tx { background:var(--tx); color:#fff; }
  .meter { height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
  .meter > div { height:100%; width:0; transition:width .08s linear; }
  #bar { background:var(--ok); } #bar.hot { background:var(--tx); }
  #rxbar, #sbar { background:var(--acc); }
  input[type=range] { width:100%; }
  input[type=text], select { background:#0e1217; color:var(--fg); border:1px solid var(--line); border-radius:8px;
                             padding:8px 10px; font:inherit; min-width:0; }
  input[type=text] { flex:1; }
  button.small { background:var(--acc); color:#04111f; border:0; border-radius:8px; padding:8px 14px; font-weight:600; }
  button.step { background:var(--line); color:var(--fg); border:0; border-radius:8px; padding:8px 14px; font-weight:700; }
  button:disabled, input:disabled, select:disabled { opacity:.4; }
  #msg { min-height:20px; color:#d29922; font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#555; margin-right:6px; }
  .dot.on { background:var(--ok); }
  .warn { color:#d29922; }
</style>
</head>
<body>
<main>
  <h1>Radio push-to-talk</h1>

  <div class="card" id="radio">
    <div class="row"><span id="freq">—</span><span id="mode" class="mut">—</span></div>
    <div class="grid" style="margin-top:10px">
      <input id="fin" type="text" inputmode="decimal" placeholder="MHz, e.g. 14.074" autocomplete="off">
      <button id="fgo" class="small">Tune</button>
    </div>
    <div class="grid" style="margin-top:8px">
      <button id="fdn" class="step">−</button>
      <select id="step">
        <option value="10">10 Hz</option><option value="100">100 Hz</option>
        <option value="1000" selected>1 kHz</option><option value="5000">5 kHz</option>
        <option value="10000">10 kHz</option><option value="100000">100 kHz</option>
      </select>
      <button id="fup" class="step">+</button>
      <select id="modesel" style="margin-left:auto"></select>
    </div>
    <div class="row mut" style="margin-top:12px"><span>Signal</span><span id="sval">—</span></div>
    <div class="meter" style="margin-top:4px"><div id="sbar"></div></div>
    <div class="row mut" style="margin-top:12px"><span>TX power</span><span id="pval">—</span></div>
    <input id="pwr" type="range" min="0" max="100" value="100">
    <div class="mut" id="txmeters" style="margin-top:6px"></div>
    <div class="mut" style="margin-top:8px">Check frequency, mode, power and that the channel is clear (or a dummy load is on) before transmitting. Arrow ↑/↓ tunes by the step.</div>
  </div>

  <div class="card">
    <div class="row"><button id="mic" class="small">Enable microphone</button>
      <span class="mut"><span id="wsdot" class="dot"></span><span id="wstxt">connecting…</span></span></div>
    <div class="meter" style="margin-top:12px"><div id="bar"></div></div>
    <div class="row mut" style="margin-top:10px"><span>Input gain</span><span id="gv">100%</span></div>
    <input id="gain" type="range" min="0" max="200" value="100">
  </div>

  <div class="card">
    <div class="row"><button id="listen" class="small">Listen to radio</button>
      <label class="mut"><input type="checkbox" id="txmute" checked> mute while transmitting</label></div>
    <div class="meter" style="margin-top:12px"><div id="rxbar"></div></div>
    <div class="row mut" style="margin-top:10px"><span>Volume</span><span id="vv">70%</span></div>
    <input id="vol" type="range" min="0" max="100" value="70">
  </div>

  <button id="ptt" disabled>HOLD TO TALK<br><span style="font-size:14px;font-weight:400">or hold Space</span></button>
  <div class="row mut"><span id="timer">TX 0.0 s</span><span>auto-unkey after 120 s</span></div>
  <div id="msg"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let ws, ctx, node, stream, gain = 1, txOn = false, wantTx = false, hbTimer = null, txStart = 0;
let play = null, listening = false, vol = 0.7;
let curHz = null, maxPower = 1, pwrTimer = null, pwrDragging = false;

function say(t){ $('msg').textContent = t || ''; }

/* ------------------------------------------------------------ websocket */
function connect(){
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('wsdot').classList.add('on'); $('wstxt').textContent = 'connected'; refresh();
                      if (listening) send({t:'listen', on:true}); };
  ws.onclose = () => { $('wsdot').classList.remove('on'); $('wstxt').textContent = 'disconnected';
                       setTx(false); wantTx = false; $('ptt').disabled = true; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {            // radio RX audio
      const muted = $('txmute').checked && (txOn || wantTx);
      if (listening && play && !muted) play.port.postMessage({pcm: e.data}, [e.data]);
      return;
    }
    const d = JSON.parse(e.data);
    if (d.t !== 'state') return;
    if (d.tx) { if (wantTx) setTx(true); else send({t:'ptt', on:false}); }
    else { setTx(false); wantTx = false;
           if (d.reason && d.reason !== 'release') say('Not transmitting: ' + d.reason);
           if (d.unkey_ok === false) say('WARNING: unkey may have failed — check the radio!'); }
  };
  if (stream) $('ptt').disabled = false;
}
function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function setTx(on){
  txOn = on;
  const b = $('ptt');
  b.classList.toggle('tx', on);
  b.classList.toggle('keying', wantTx && !on);
  lockRadio(on || wantTx);
  if (on) txStart = performance.now();
  else $('txmeters').textContent = '';
}
function lockRadio(lock){
  ['fin','fgo','fup','fdn','step','modesel','pwr'].forEach(id => $(id).disabled = lock);
}

/* ------------------------------------------------------------------ PTT */
function pttDown(){
  if (!stream || wantTx || ws.readyState !== 1) return;
  if (ctx.state === 'suspended') ctx.resume();
  say(''); wantTx = true; lockRadio(true); setTx(false);
  if (play) play.port.postMessage({flush: true});   // drop queued RX so it doesn't play over TX
  send({t:'ptt', on:true});
  clearInterval(hbTimer);
  hbTimer = setInterval(() => send({t:'hb'}), 250);
}
function pttUp(){
  if (!wantTx) return;
  wantTx = false; txOn = false;
  clearInterval(hbTimer);
  send({t:'ptt', on:false});
  $('ptt').classList.remove('tx', 'keying');
}
const b = $('ptt');
b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); pttDown(); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, pttUp));
window.addEventListener('blur', pttUp);
document.addEventListener('visibilitychange', () => { if (document.hidden) pttUp(); });
window.addEventListener('keydown', e => {
  const typing = ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName) &&
                 document.activeElement.type !== 'range' && document.activeElement.type !== 'checkbox';
  if (e.code === 'Space' && !e.repeat && !typing) { e.preventDefault(); pttDown(); }
  else if (!typing && (e.code === 'ArrowUp' || e.code === 'ArrowDown') && !txOn && !wantTx) {
    e.preventDefault(); stepFreq(e.code === 'ArrowUp' ? 1 : -1);
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); pttUp(); } });
window.addEventListener('beforeunload', pttUp);

/* ---------------------------------------------------------- audio (mic) */
const workletSrc = `
class Cap extends AudioWorkletProcessor {
  constructor(){ super(); this.pos = 0; this.buf = []; this.gain = 1;
    this.step = sampleRate / 48000;
    this.port.onmessage = e => { this.gain = e.data; }; }
  process(inputs){
    const ch = inputs[0][0]; if (!ch) return true;
    let peak = 0;
    for (let i = 0; i < ch.length; i++) { const v = ch[i] * this.gain; if (Math.abs(v) > peak) peak = Math.abs(v); this.buf.push(v); }
    const out = [];
    while (this.pos + 1 < this.buf.length) {            // linear resample to 48 kHz
      const i = Math.floor(this.pos), f = this.pos - i;
      let s = this.buf[i] * (1 - f) + this.buf[i + 1] * f;
      s = Math.max(-1, Math.min(1, s));
      out.push(s < 0 ? s * 32768 : s * 32767);
      this.pos += this.step;
    }
    const drop = Math.floor(this.pos); this.buf = this.buf.slice(drop); this.pos -= drop;
    if (out.length) { const a = new Int16Array(out); this.port.postMessage({pcm: a.buffer, peak}, [a.buffer]); }
    else this.port.postMessage({peak});
    return true;
  }
}
registerProcessor('cap', Cap);`;

/* ---------------------------------------------------- audio (radio RX) */
const playSrc = `
class Play extends AudioWorkletProcessor {
  constructor(){ super(); this.size = 96000; this.buf = new Float32Array(this.size);
    this.w = 0; this.r = 0; this.vol = 0.7; this.run = false; this.step = 48000 / sampleRate; this.n = 0; this.pk = 0;
    this.port.onmessage = e => { const d = e.data;
      if (d.vol !== undefined) { this.vol = d.vol; return; }
      if (d.flush) { this.r = this.w; this.run = false; return; }
      const a = new Int16Array(d.pcm);
      for (let i = 0; i < a.length; i++) { this.buf[this.w % this.size] = a[i] / 32768; this.w++; }
      if (this.w - this.r > 19200) this.r = this.w - 9600;          // >400 ms behind: skip to 200 ms
    }; }
  process(inputs, outputs){
    const out = outputs[0][0];
    const avail = this.w - this.r;
    if (!this.run && avail >= 4800) this.run = true;                 // 100 ms prebuffer
    if (this.run && avail < out.length * this.step + 2) this.run = false;
    if (this.run) for (let i = 0; i < out.length; i++) {
      const k = Math.floor(this.r), f = this.r - k;
      const s = (this.buf[k % this.size] * (1 - f) + this.buf[(k + 1) % this.size] * f) * this.vol;
      out[i] = s; if (Math.abs(s) > this.pk) this.pk = Math.abs(s);
      this.r += this.step;
    }
    if (++this.n % 8 === 0) { this.port.postMessage({peak: this.pk}); this.pk = 0; }
    return true;
  }
}
registerProcessor('play', Play);`;

async function ensureCtx(){
  if (!ctx) {
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSrc + playSrc], {type:'application/javascript'})));
  }
  if (ctx.state === 'suspended') await ctx.resume();
}

$('mic').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1}});
    await ensureCtx();
    node = new AudioWorkletNode(ctx, 'cap');
    ctx.createMediaStreamSource(stream).connect(node);
    node.port.postMessage(gain);
    node.port.onmessage = e => {
      const {pcm, peak} = e.data;
      $('bar').style.width = Math.min(100, peak * 100) + '%';
      $('bar').classList.toggle('hot', peak > 0.9);
      if (pcm && txOn && ws.readyState === 1) ws.send(pcm);
    };
    $('mic').textContent = 'Microphone on'; $('mic').disabled = true;
    if (ws.readyState === 1) $('ptt').disabled = false;
  } catch (err) {
    say('Mic error: ' + err.message + (location.hostname !== 'localhost' ? ' (open via http://localhost:PORT using the SSH tunnel)' : ''));
  }
};
$('gain').oninput = e => { gain = e.target.value / 100; $('gv').textContent = e.target.value + '%'; if (node) node.port.postMessage(gain); };

$('listen').onclick = async () => {
  try {
    await ensureCtx();
    if (!play) {
      play = new AudioWorkletNode(ctx, 'play');
      play.connect(ctx.destination);
      play.port.onmessage = e => { $('rxbar').style.width = Math.min(100, e.data.peak * 100) + '%'; };
      play.port.postMessage({vol});
    }
    listening = !listening;
    play.port.postMessage({flush: true});
    send({t:'listen', on: listening});
    $('listen').textContent = listening ? 'Listening — click to stop' : 'Listen to radio';
    if (!listening) $('rxbar').style.width = '0';
  } catch (err) { say('Audio error: ' + err.message); }
};
$('vol').oninput = e => { vol = e.target.value / 100; $('vv').textContent = e.target.value + '%';
                          if (play) play.port.postMessage({vol}); };

/* ------------------------------------------------------- radio control */
const pad3 = n => String(n).padStart(3, '0');
const fmtHz = hz => `${Math.floor(hz / 1e6)}.${pad3(Math.floor(hz / 1e3) % 1000)}.${pad3(hz % 1000)}`;

async function post(path, body){
  try {
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) say((d.error || 'request failed') + (d.reply ? ' (' + d.reply + ')' : ''));
    else say('');
    return r.ok;
  } catch (e) { say('Request failed: ' + e.message); return false; }
}

async function tuneTo(hz){
  hz = Math.round(hz);
  if (await post('/rig/freq', {hz})) { curHz = hz; $('freq').textContent = fmtHz(hz); }
  refresh();
}
function stepFreq(dir){
  if (curHz == null || txOn || wantTx) return;
  tuneTo(curHz + dir * parseInt($('step').value));
}
function parseFreq(txt){
  const v = parseFloat(txt.replace(',', '.'));
  if (!isFinite(v) || v <= 0) return null;
  return v < 500 ? v * 1e6 : v < 5e5 ? v * 1e3 : v;     // MHz, kHz or Hz
}
$('fgo').onclick = () => { const hz = parseFreq($('fin').value); if (hz == null) return say('Enter a frequency in MHz, e.g. 14.074'); tuneTo(hz); $('fin').value = ''; };
$('fin').addEventListener('keydown', e => { if (e.key === 'Enter') $('fgo').click(); });
$('fup').onclick = () => stepFreq(1);
$('fdn').onclick = () => stepFreq(-1);
$('modesel').onchange = async e => { await post('/rig/mode', {mode: e.target.value}); refresh(); };

$('pwr').oninput = e => { pwrDragging = true; $('pval').textContent = pwrText(e.target.value / 100); };
$('pwr').onchange = async e => {
  const v = Math.min(parseInt(e.target.value) / 100, maxPower);
  await post('/rig/power', {value: v});
  pwrDragging = false; refresh();
};
const pwrText = v => `${Math.round(v * 100)}% (~${Math.round(v * 100)} W)`;

function sText(db){                     // hamlib STRENGTH is dB relative to S9
  if (db == null) return '—';
  if (db > 0) return 'S9+' + Math.round(db) + ' dB';
  return 'S' + Math.max(0, Math.round(9 + db / 6));
}

async function refresh(){
  try {
    const d = await (await fetch('/status')).json();
    if (d.error) { $('mode').textContent = 'rig: ' + d.error; return; }
    curHz = d.freq; $('freq').textContent = fmtHz(d.freq);
    $('mode').textContent = d.mode ? d.mode + (d.passband ? ' · ' + d.passband + ' Hz' : '') : 'mode unavailable';
    if (d.modes && !$('modesel').options.length)
      d.modes.forEach(m => $('modesel').add(new Option(m, m)));
    if (d.mode && document.activeElement !== $('modesel')) $('modesel').value = d.mode;
    maxPower = d.max_power;
    $('pwr').max = Math.round(maxPower * 100);
    if (d.power != null && !pwrDragging) { $('pwr').value = Math.round(d.power * 100); $('pval').textContent = pwrText(d.power); }
    if (d.tx) {
      const bits = [];
      if (d.pwr_w != null) bits.push(d.pwr_w.toFixed(0) + ' W');
      if (d.swr != null) bits.push('SWR ' + d.swr.toFixed(1));
      if (d.alc != null) bits.push('ALC ' + d.alc.toFixed(2));
      $('txmeters').textContent = bits.join(' · ');
    } else {
      $('sval').textContent = sText(d.strength);
      $('sbar').style.width = d.strength == null ? '0' : Math.max(0, Math.min(100, (d.strength + 54) / 114 * 100)) + '%';
    }
  } catch { $('mode').textContent = 'status unavailable'; }
}
setInterval(() => { if (!pwrDragging) refresh(); }, 1000);
setInterval(() => { if (txOn) $('timer').textContent = 'TX ' + ((performance.now() - txStart) / 1000).toFixed(1) + ' s'; }, 100);
connect();
</script>
</body>
</html>
